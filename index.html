<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>나만의 중국어 단어장</title>
  <script src="[https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js](https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js)"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --sub: #64748b;
      --know: #16a34a;
      --hold: #d97706;
      --unknown: #dc2626;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; -webkit-tap-highlight-color: transparent; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
    h2 { margin: 0; font-size: 1.25rem; }

    .panel { background: var(--card); padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .space-between { justify-content: space-between; }

    button { background: var(--primary); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s; }
    button:hover { opacity: 0.92; }
    button.outline { background: #f1f5f9; color: var(--text); border: 1px solid #cbd5e1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    select, input[type="text"], input[type="password"] { padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.82rem; background: #fff; }
    input[type="password"], input[type="text"] { flex: 1; max-width: 240px; }

    /* 하루 분량 & 오답 모아보기 하이라이트 바 */
    .study-plan-bar { background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .hard-toggle-btn { background: #fff; color: #dc2626; border: 1.5px solid #fca5a5; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; gap: 4px; }
    .hard-toggle-btn.active { background: #dc2626; color: #fff; border-color: #dc2626; }

    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab-btn { background: #e2e8f0; color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; flex: 1; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #fff; }

    /* 플래시카드 영역 */
    .card-box { background: var(--card); border-radius: 16px; padding: 32px 16px 24px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06); min-height: 270px; display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative; cursor: pointer; user-select: none; touch-action: pan-y; }
    .card-top-meta { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--sub); }
    .weak-badge { padding: 3px 8px; border-radius: 999px; font-weight: 700; font-size: 0.72rem; }
    .weak-high { background: #fee2e2; color: #991b1b; }
    .weak-mid { background: #fef3c7; color: #92400e; }
    .weak-low { background: #dcfce7; color: #166534; }
    .weak-none { background: #f1f5f9; color: #475569; }

    .hanzi { font-size: 3.1rem; font-weight: 800; margin: 8px 0 2px; line-height: 1.2; }
    .pinyin { font-size: 1.15rem; color: #475569; margin: 0; }
    .meaning { font-size: 1.35rem; color: var(--primary); font-weight: 700; margin: 4px 0; }
    
    .card-tts-row { display: flex; justify-content: center; gap: 8px; margin: 4px 0; }
    .tts-btn { background: #f1f5f9; color: var(--text); border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }

    .example-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 6px; font-size: 0.88rem; line-height: 1.45; text-align: center; }
    .hidden { display: none !important; }

    .eval-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .btn-unknown { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; padding: 11px 4px; font-size: 0.88rem; font-weight: 700; border-radius: 8px; text-align: center; }
    .btn-hold { background: #fef3c7; color: #92400e; border: 2px solid #fde047; padding: 11px 4px; font-size: 0.88rem; font-weight: 700; border-radius: 8px; text-align: center; }
    .btn-know { background: #dcfce7; color: #166534; border: 2px solid #86efac; padding: 11px 4px; font-size: 0.88rem; font-weight: 700; border-radius: 8px; text-align: center; }

    .stat-bar-wrap { width: 100%; max-width: 210px; margin: 4px auto 0; }
    .stat-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: #e2e8f0; }
    .bar-u { background: var(--unknown); }
    .bar-h { background: var(--hold); }
    .bar-k { background: var(--know); }
    .stat-counts { font-size: 0.72rem; color: var(--sub); margin-top: 3px; display: flex; justify-content: space-between; }

    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .quiz-option { background: #f1f5f9; color: var(--text); padding: 13px 8px; border-radius: 8px; font-size: 0.92rem; border: 2px solid transparent; text-align: center; }
    .quiz-option.correct { border-color: var(--know); background: #dcfce7; color: #166534; }
    .quiz-option.wrong { border-color: var(--unknown); background: #fee2e2; color: #991b1b; }

    .table-wrap { overflow-x: auto; background: var(--card); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    table { width: 100%; border-collapse: collapse; min-width: 680px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 0.84rem; vertical-align: middle; }
    th { background: #f1f5f9; font-weight: 700; color: #334155; }
    .mini-eval-btns button { padding: 3px 6px; font-size: 0.72rem; border-radius: 4px; margin-right: 2px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>🇨🇳 나만의 중국어 단어장</h2>
    <div class="row">
      <label style="font-size:0.8rem; cursor:pointer;">
        <input type="checkbox" id="autoTts" checked> 자동 발음
      </label>
    </div>
  </header>

  <!-- 1. 파일 업로드, 백업 및 AI 예문 생성 패널 -->
  <div class="panel">
    <div class="row space-between">
      <div class="row">
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" style="font-size: 0.78rem; max-width: 175px;">
        <button onclick="exportExcel()" class="outline" style="padding: 6px 10px; font-size: 0.78rem;">📥 엑셀 백업</button>
        <button onclick="resetSampleData()" class="outline" style="padding: 6px 10px; font-size: 0.78rem;">🔄 초기화</button>
      </div>
      <small id="statusText" style="color: var(--sub); font-weight: 600; font-size: 0.75rem;"></small>
    </div>

    <div class="row">
      <input type="password" id="apiKey" placeholder="Gemini API Key 입력 (자동 저장됨)" onchange="saveApiKey()">
      <button id="genBtn" onclick="generateExamples()" style="padding: 7px 10px; font-size: 0.8rem;">⚡ 빈 예문 AI 생성</button>
    </div>
  </div>

  <!-- 2. 하루 목표 학습량 & 오답/어려운 단어 집중 모드 바 -->
  <div class="study-plan-bar">
    <div class="row space-between">
      <div class="row">
        <label style="font-size:0.8rem; font-weight:700; color:#1e40af;">📅 하루 목표:</label>
        <select id="dailySizeSelect" onchange="onChangeDailySize()" style="font-size:0.8rem; padding:4px 8px; font-weight:600;">
          <option value="0">전체 다 보기</option>
          <option value="10">10개씩 쪼개기</option>
          <option value="20" selected>20개씩 쪼개기</option>
          <option value="30">30개씩 쪼개기</option>
          <option value="50">50개씩 쪼개기</option>
        </select>

        <select id="batchIndexSelect" onchange="onChangeBatchIndex()" style="font-size:0.8rem; padding:4px 8px; font-weight:600;">
          <option value="0">Day 1</option>
        </select>
      </div>

      <!-- 오답/어려운 단어만 모아보기 원클릭 스위치 -->
      <button id="hardModeBtn" class="hard-toggle-btn" onclick="toggleHardMode()">
        🚨 오답·어려운 단어만 보기: OFF
      </button>
    </div>

    <!-- 세부 필터 및 정렬 -->
    <div class="row space-between" style="border-top: 1px solid #dbeafe; padding-top: 6px;">
      <div class="row">
        <label style="font-size:0.76rem; font-weight:600;">급수:</label>
        <select id="levelFilter" onchange="onFilterChange()" style="font-size: 0.76rem; padding: 3px 6px;">
          <option value="all">전체</option>
        </select>

        <label style="font-size:0.76rem; font-weight:600; margin-left:4px;">세부 상태:</label>
        <select id="stateFilter" onchange="onFilterChange()" style="font-size: 0.76rem; padding: 3px 6px;">
          <option value="all">전체 상태</option>
          <option value="weak_only">❌+⚠️ 오답/보류 1회 이상</option>
          <option value="weak_focus">🔥 고위험군 (취약도 ≥ 50%)</option>
          <option value="has_unknown">❌ 모르겠다 있음</option>
          <option value="unstudied">🆕 미학습 단어</option>
        </select>
      </div>

      <div class="row">
        <label style="font-size:0.76rem; font-weight:600;">정렬:</label>
        <select id="sortOrder" onchange="onFilterChange()" style="font-size: 0.76rem; padding: 3px 6px;">
          <option value="original">🔢 등록순 (Day 진도용)</option>
          <option value="weak_ratio_desc">🔥 취약도 높은 순</option>
          <option value="weak_count_desc">💥 많이 틀린 순(오답+보류)</option>
          <option value="less_studied">🌱 적게 본 순</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('flashcard', this)">🗂️ 플래시카드</button>
    <button class="tab-btn" onclick="switchMode('quiz', this)">🎯 퀴즈</button>
    <button class="tab-btn" onclick="switchMode('list', this)">📊 현재 목록</button>
  </div>

  <!-- 뷰 1: 플래시카드 -->
  <div id="flashcardView" class="view">
    <div class="card-box" id="flashcardCard" onclick="handleCardClick(event)">
      <div class="card-top-meta">
        <span id="fcProgress">1 / 20</span>
        <div>
          <span id="fcLevelBadge" class="weak-badge" style="background:#e0f2fe; color:#0369a1; margin-right:4px;">1급</span>
          <span id="fcWeakBadge" class="weak-badge weak-none">미학습</span>
        </div>
      </div>

      <p class="hanzi" id="fcHanzi"></p>
      
      <div class="card-tts-row" onclick="event.stopPropagation()">
        <button class="tts-btn" onclick="speakCurrentWord()">🔊 단어</button>
        <button class="tts-btn" id="fcExTtsBtn" onclick="speakCurrentExample()">🔊 예문</button>
      </div>

      <p style="font-size:0.74rem; color:var(--sub); margin:2px 0 0;">(카드 터치로 뜻 보기 / 좌우 밀어서 이동)</p>

      <div id="fcAnswer" class="hidden">
        <p class="pinyin" id="fcPinyin"></p>
        <p class="meaning" id="fcMeaning"></p>
        <div class="example-box" id="fcExample"></div>
      </div>

      <div class="stat-bar-wrap" onclick="event.stopPropagation()">
        <div class="stat-bar" id="fcStatBar"></div>
        <div class="stat-counts" id="fcStatCounts"></div>
      </div>
    </div>

    <!-- 평가 버튼 -->
    <div class="eval-group">
      <button class="btn-unknown" onclick="recordStudy('unknown')">❌ 모르겠다 (1)</button>
      <button class="btn-hold" onclick="recordStudy('hold')">⚠️ 보류 (2)</button>
      <button class="btn-know" onclick="recordStudy('know')">⭕ 알겠다 (3)</button>
    </div>

    <div class="row" style="justify-content: center; margin-top: 8px; gap: 6px;">
      <button class="outline" onclick="moveCard(-1)">◀ 이전</button>
      <button class="outline" style="background:#fef2f2; color:#b91c1c; border-color:#fca5a5;" onclick="undoLastStudy()">↩️ 직전 취소</button>
      <button class="outline" onclick="shuffleCurrentStudyList()">🔀 순서 섞기</button>
      <button class="outline" onclick="moveCard(1)">다음 ▶</button>
    </div>
  </div>

  <!-- 뷰 2: 퀴즈 -->
  <div id="quizView" class="view hidden">
    <div class="card-box" style="cursor:default; padding: 22px 14px;">
      <div class="card-top-meta">
        <span id="qzLevelBadge" class="weak-badge" style="background:#e0f2fe; color:#0369a1;">1급</span>
        <span id="qzWeakBadge" class="weak-badge weak-none"></span>
      </div>
      <p class="hanzi" id="qzHanzi" style="margin:4px 0 0;"></p>
      <p class="pinyin" id="qzPinyin" style="margin:0;"></p>
      
      <div style="margin-top: 4px;">
        <button class="btn-unknown" onclick="markQuizAsUnknown()" style="padding: 5px 12px; font-size: 0.8rem;">❌ 모르겠다 (즉시 오답 처리)</button>
      </div>

      <div class="quiz-options" id="qzOptions"></div>
    </div>
  </div>

  <!-- 뷰 3: 전체 목록 -->
  <div id="listView" class="view hidden">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>순번</th>
            <th>급수</th>
            <th>한자/병음</th>
            <th>의미</th>
            <th>예문</th>
            <th>취약도</th>
            <th>기록</th>
            <th>발음</th>
          </tr>
        </thead>
        <tbody id="wordTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SAMPLE_WORDS = [
    { id: 1, level: '3급', hanzi: '准备', pinyin: 'zhǔnbèi', meaning: '준비하다', exHanzi: '我已经准备好去旅行了。', exPinyin: 'Wǒ yǐjīng zhǔnbèi hǎo qù lǚxíng le.', exMeaning: '이미 여행 갈 준비를 마쳤다.', know: 5, hold: 0, unknown: 0 },
    { id: 2, level: '3급', hanzi: '习惯', pinyin: 'xíguàn', meaning: '습관, 익숙해지다', exHanzi: '我已经习惯早起了。', exPinyin: 'Wǒ yǐjīng xíguàn zǎoqǐ le.', exMeaning: '일찍 일어나는 것에 익숙해졌다.', know: 4, hold: 1, unknown: 0 },
    { id: 3, level: '3급', hanzi: '差不多', pinyin: 'chàbuduō', meaning: '비슷하다, 거의', exHanzi: '这两个词的意思差不多。', exPinyin: 'Zhè liǎng gè cí de yìsi chàbuduō.', exMeaning: '두 단어의 뜻은 거의 비슷하다.', know: 2, hold: 2, unknown: 1 },
    { id: 4, level: '3급', hanzi: '感兴趣', pinyin: 'gǎn xìngqù', meaning: '흥미를 느끼다', exHanzi: '我对中国历史很感兴趣。', exPinyin: 'Wǒ duì Zhōngguó lìshǐ hěn gǎn xìngqù.', exMeaning: '중국 역사에 매우 흥미가 있다.', know: 1, hold: 2, unknown: 0 },
    { id: 5, level: '4급', hanzi: '顺便', pinyin: 'shùnbiàn', meaning: '겸사겸사, 가는 길에', exHanzi: '你去超市的时候，顺便帮我买瓶水吧。', exPinyin: 'Nǐ qù chāoshì de shíhou, shùnbiàn bāng wǒ mǎi píng shuǐ ba.', exMeaning: '마트 가는 김에 내 물도 사다 줘.', know: 1, hold: 3, unknown: 2 },
    { id: 6, level: '4급', hanzi: '来得及', pinyin: 'láidejí', meaning: '제시간에 대다, 늦지 않다', exHanzi: '现在出发还来得及看电影。', exPinyin: 'Xiànzài chūfā hái láidejí kàn diànyǐng.', exMeaning: '지금 출발하면 영화 보기에 늦지 않아.', know: 0, hold: 1, unknown: 3 },
    { id: 7, level: '4급', hanzi: '随便', pinyin: 'suíbiàn', meaning: '마음대로 하다', exHanzi: '午饭吃什么都行，随便你。', exPinyin: 'Wǔfàn chī shénme dōu xíng, suíbiàn nǐ.', exMeaning: '점심은 뭐든 괜찮아, 네 마음대로 해.', know: 1, hold: 2, unknown: 4 },
    { id: 8, level: '4급', hanzi: '放心', pinyin: 'fàngxīn', meaning: '안심하다', exHanzi: '这件事交给我，你放心吧。', exPinyin: 'Zhè jiàn shì jiāo gěi wǒ, nǐ fàngxīn ba.', exMeaning: '이 일은 나에게 맡기고 안심해.', know: 3, hold: 0, unknown: 1 }
  ];

  // 기존 로컬스토리지 데이터까지 호환 로드
  function loadInitialWords() {
    const keys = ['myPureVocabData', 'myChnWordsV10', 'myChnWordsV9', 'myChnWordsV8'];
    for (const k of keys) {
      const raw = localStorage.getItem(k);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch (e) {}
      }
    }
    return SAMPLE_WORDS;
  }

  let words = loadInitialWords();
  let studyWords = []; // 현재 Day 분량 + 필터가 적용된 최종 학습 단어 배열
  let currentIndex = 0;
  let currentQuizWord = null;
  let lastAction = null;
  let isHardModeOnly = false; // 오답/어려운 단어만 보기 토글 상태

  // 스와이프 및 터치 충돌 방지 변수
  let touchStartX = 0;
  let touchStartY = 0;
  let isSwiping = false;

  window.addEventListener('DOMContentLoaded', () => {
    // 저장된 API 키 및 하루 목표량 복원
    const savedKey = localStorage.getItem('myGeminiApiKey');
    if (savedKey) document.getElementById('apiKey').value = savedKey;

    const savedDailySize = localStorage.getItem('myDailySize');
    if (savedDailySize !== null) {
      document.getElementById('dailySizeSelect').value = savedDailySize;
    }

    initLevelOptions();
    buildStudyList(true);
    initSwipeEvents();
  });

  function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key) localStorage.setItem('myGeminiApiKey', key);
  }

  function saveData() {
    localStorage.setItem('myPureVocabData', JSON.stringify(words));
    updateStatus();
  }

  // 스와이프와 클릭 충돌 완벽 방지
  function initSwipeEvents() {
    const card = document.getElementById('flashcardCard');
    card.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
      isSwiping = false;
    }, {passive: true});

    card.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      // 상하 스크롤보다 좌우 이동이 크고 45px 이상 밀었을 때만 스와이프로 인정
      if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
        isSwiping = true;
        if (diffX < 0) moveCard(1);
        else moveCard(-1);
        setTimeout(() => { isSwiping = false; }, 250);
      }
    }, {passive: true});
  }

  function handleCardClick(e) {
    if (isSwiping) return; // 방금 스와이프했다면 뜻 토글 무시
    toggleCardAnswer();
  }

  function getStats(w) {
    const k = Number(w.know || 0);
    const h = Number(w.hold || 0);
    const u = Number(w.unknown || 0);
    const total = k + h + u;
    const weakCount = u + h;
    const weightedWeak = (u * 1.0) + (h * 0.5);
    const weakRatio = total > 0 ? (weightedWeak / total) * 100 : -1;
    const rawWeakRatio = total > 0 ? (weakCount / total) * 100 : 0;
    return { k, h, u, total, weakCount, weightedWeak, weakRatio, rawWeakRatio };
  }

  // 오답/어려운 단어만 보기 스위치 토글
  function toggleHardMode() {
    isHardModeOnly = !isHardModeOnly;
    const btn = document.getElementById('hardModeBtn');
    if (isHardModeOnly) {
      btn.classList.add('active');
      btn.textContent = '🚨 오답·어려운 단어만 보기: ON';
      document.getElementById('stateFilter').value = 'weak_only';
    } else {
      btn.classList.remove('active');
      btn.textContent = '🚨 오답·어려운 단어만 보기: OFF';
      document.getElementById('stateFilter').value = 'all';
    }
    buildStudyList(true);
  }

  function onChangeDailySize() {
    const val = document.getElementById('dailySizeSelect').value;
    localStorage.setItem('myDailySize', val);
    document.getElementById('batchIndexSelect').value = '0';
    buildStudyList(true);
  }

  function onChangeBatchIndex() {
    localStorage.setItem('myBatchIdx', document.getElementById('batchIndexSelect').value);
    buildStudyList(true);
  }

  function onFilterChange() {
    const stateVal = document.getElementById('stateFilter').value;
    const btn = document.getElementById('hardModeBtn');
    if (stateVal === 'weak_only') {
      isHardModeOnly = true;
      btn.classList.add('active');
      btn.textContent = '🚨 오답·어려운 단어만 보기: ON';
    } else {
      isHardModeOnly = false;
      btn.classList.remove('active');
      btn.textContent = '🚨 오답·어려운 단어만 보기: OFF';
    }
    buildStudyList(true);
  }

  // 핵심: 급수 -> 하루 목표량(Day 구간) -> 오답 필터 순으로 학습 목록 구성
  function buildStudyList(resetIndex = false) {
    const levelVal = document.getElementById('levelFilter').value;
    const stateVal = document.getElementById('stateFilter').value;
    const sortVal = document.getElementById('sortOrder').value;
    const dailySize = Number(document.getElementById('dailySizeSelect').value || 0);

    // 1. 급수 필터
    let baseList = words.filter(w => {
      if (levelVal === 'all') return true;
      return String(w.level || '일반').trim() === levelVal;
    });

    // 2. 정렬 (등록순일 때는 Day 구간이 고정되고, 취약도순일 때는 전체 중 취약한 순으로 Day가 나뉨)
    baseList.sort((a, b) => {
      const sa = getStats(a);
      const sb = getStats(b);
      if (sortVal === 'weak_ratio_desc') {
        if (sb.weakRatio !== sa.weakRatio) return sb.weakRatio - sa.weakRatio;
        return sb.u - sa.u;
      }
      if (sortVal === 'weak_count_desc') {
        if (sb.weakCount !== sa.weakCount) return sb.weakCount - sa.weakCount;
        return sb.u - sa.u;
      }
      if (sortVal === 'less_studied') return sa.total - sb.total;
      return (a.id || 0) - (b.id || 0);
    });

    // 3. 하루 목표 개수(Day 구간) 드롭다운 구성 및 슬라이싱
    const batchSel = document.getElementById('batchIndexSelect');
    letslicedList = baseList;

    if (dailySize > 0 && baseList.length > 0) {
      const totalBatches = Math.ceil(baseList.length / dailySize);
      let currentBatchIdx = Number(batchSel.value || localStorage.getItem('myBatchIdx') || 0);
      if (currentBatchIdx >= totalBatches) currentBatchIdx = 0;

      batchSel.innerHTML = '';
      for (let i = 0; i < totalBatches; i++) {
        const start = i * dailySize + 1;
        const end = Math.min((i + 1) * dailySize, baseList.length);
        batchSel.innerHTML += `<option value="${i}">Day ${i + 1} (${start}~${end}번)</option>`;
      }
      batchSel.value = String(currentBatchIdx);
      batchSel.disabled = false;

      const startIdx = currentBatchIdx * dailySize;
      letslicedList = baseList.slice(startIdx, startIdx + dailySize);
    } else {
      batchSel.innerHTML = `<option value="0">전체 (${baseList.length}개)</option>`;
      batchSel.disabled = true;
    }

    // 4. 선택한 Day 구간 안에서 오답/어려운 단어 필터링
    studyWords = letslicedList.filter(w => {
      const s = getStats(w);
      if (stateVal === 'weak_only') return s.u > 0 || s.h > 0;
      if (stateVal === 'weak_focus') return s.total > 0 && s.rawWeakRatio >= 50;
      if (stateVal === 'has_unknown') return s.u > 0;
      if (stateVal === 'unstudied') return s.total === 0;
      return true;
    });

    if (resetIndex) {
      currentIndex = 0;
    } else if (currentIndex >= studyWords.length) {
      currentIndex = Math.max(0, studyWords.length - 1);
    }

    updateStatus();
    renderFlashcard();
    renderTable();
  }

  function shuffleCurrentStudyList() {
    if (studyWords.length <= 1) return;
    studyWords.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    renderFlashcard();
    renderTable();
  }

  function renderFlashcard() {
    const hanziEl = document.getElementById('fcHanzi');
    const progEl = document.getElementById('fcProgress');
    const badgeEl = document.getElementById('fcWeakBadge');
    const levelBadgeEl = document.getElementById('fcLevelBadge');
    const exTtsBtn = document.getElementById('fcExTtsBtn');

    if (studyWords.length === 0) {
      hanziEl.textContent = isHardModeOnly ? '🎉 이 구간에 오답/보류 단어가 없습니다!' : '조건에 맞는 단어가 없습니다';
      progEl.textContent = '0 / 0';
      badgeEl.textContent = '-';
      levelBadgeEl.textContent = '-';
      exTtsBtn.style.display = 'none';
      document.getElementById('fcAnswer').classList.add('hidden');
      document.getElementById('fcStatBar').innerHTML = '';
      document.getElementById('fcStatCounts').innerHTML = '';
      return;
    }

    const w = studyWords[currentIndex];
    const s = getStats(w);

    progEl.textContent = `${currentIndex + 1} / ${studyWords.length}`;
    levelBadgeEl.textContent = w.level || '일반';
    hanziEl.textContent = w.hanzi;
    
    exTtsBtn.style.display = w.exHanzi ? 'flex' : 'none';

    document.getElementById('fcPinyin').textContent = `[ ${w.pinyin} ]`;
    document.getElementById('fcMeaning').textContent = w.meaning;
    document.getElementById('fcExample').innerHTML = w.exHanzi
      ? `<strong>${w.exHanzi}</strong><br><span style="color:var(--sub)">${w.exPinyin || ''}</span><br>${w.exMeaning || ''}`
      : '<em>아직 예문이 없습니다. 상단 [⚡ 빈 예문 AI 생성]을 눌러보세요!</em>';

    document.getElementById('fcAnswer').classList.add('hidden');
    setBadgeStyle(badgeEl, s);

    if (s.total > 0) {
      const uPct = (s.u / s.total) * 100;
      const hPct = (s.h / s.total) * 100;
      const kPct = (s.k / s.total) * 100;
      document.getElementById('fcStatBar').innerHTML = `
        <div class="bar-u" style="width:${uPct}%"></div>
        <div class="bar-h" style="width:${hPct}%"></div>
        <div class="bar-k" style="width:${kPct}%"></div>
      `;
    } else {
      document.getElementById('fcStatBar').innerHTML = '';
    }
    document.getElementById('fcStatCounts').innerHTML = `
      <span style="color:var(--unknown)">❌ ${s.u}</span>
      <span style="color:var(--hold)">⚠️ ${s.h}</span>
      <span style="color:var(--know)">⭕ ${s.k}</span>
    `;

    if (document.getElementById('autoTts').checked) {
      speakChinese(w.hanzi);
    }
  }

  function setBadgeStyle(el, s) {
    el.className = 'weak-badge';
    if (s.total === 0) {
      el.classList.add('weak-none');
      el.textContent = '🆕 미학습';
    } else if (s.weakRatio >= 60) {
      el.classList.add('weak-high');
      el.textContent = `🔥 취약 ${Math.round(s.weakRatio)}%`;
    } else if (s.weakRatio >= 25) {
      el.classList.add('weak-mid');
      el.textContent = `⚠️ 보통 ${Math.round(s.weakRatio)}%`;
    } else {
      el.classList.add('weak-low');
      el.textContent = `✅ 안정 ${Math.round(s.weakRatio)}%`;
    }
  }

  function recordStudy(type) {
    if (studyWords.length === 0) return;
    const w = studyWords[currentIndex];
    w[type] = Number(w[type] || 0) + 1;
    lastAction = { word: w, type: type, prevIndex: currentIndex };

    saveData();
    renderTable();

    if (currentIndex < studyWords.length - 1) {
      currentIndex++;
      renderFlashcard();
    } else {
      // 현재 Day 분량 마지막 단어까지 학습 완료 시 반복 학습 안내
      const weakInBatch = studyWords.filter(item => (item.unknown || 0) + (item.hold || 0) > 0).length;
      if (!isHardModeOnly && weakInBatch > 0) {
        if (confirm(`현재 학습 분량(${studyWords.length}개) 1회독 완료!\n이 중 헷갈리거나 틀린 단어가 ${weakInBatch}개 있습니다.\n\n[확인]을 누르면 어려운 단어만 모아서 집중 복습하고,\n[취소]를 누르면 현재 분량을 처음부터 다시 반복합니다.`)) {
          toggleHardMode();
          return;
        }
      } else {
        alert(`🎉 현재 목록(${studyWords.length}개) 회독 완료! 1번 카드로 돌아가 반복 학습을 이어갑니다.`);
      }
      currentIndex = 0;
      renderFlashcard();
    }
  }

  function undoLastStudy() {
    if (!lastAction) {
      return alert('취소할 직전 기록이 없습니다.');
    }
    const { word, type, prevIndex } = lastAction;
    if (word[type] > 0) {
      word[type] -= 1;
      saveData();
      renderTable();
      currentIndex = Math.min(prevIndex, Math.max(0, studyWords.length - 1));
      renderFlashcard();
      lastAction = null;
    }
  }

  function recordFromTable(wordId, type) {
    const w = words.find(item => item.id === wordId);
    if (!w) return;
    w[type] = Number(w[type] || 0) + 1;
    saveData();
    buildStudyList(false);
  }

  function markQuizAsUnknown() {
    if (!currentQuizWord) return;
    currentQuizWord.unknown = Number(currentQuizWord.unknown || 0) + 1;
    saveData();
    renderTable();
    nextQuiz();
  }

  function nextQuiz() {
    if (studyWords.length === 0) {
      alert('현재 선택된 범위에 출제할 단어가 없습니다.');
      return;
    }
    if (words.length < 4) {
      alert('4지선다 퀴즈를 진행하려면 전체 단어장에 최소 4개 이상의 단어가 필요합니다.');
      return;
    }

    // 현재 학습 범위(Day 분량 또는 오답 모음) 안에서 문제 출제
    const targetIdx = Math.floor(Math.random() * studyWords.length);
    currentQuizWord = studyWords[targetIdx];

    document.getElementById('qzLevelBadge').textContent = currentQuizWord.level || '일반';
    document.getElementById('qzHanzi').textContent = currentQuizWord.hanzi;
    document.getElementById('qzPinyin').textContent = `[ ${currentQuizWord.pinyin} ]`;
    setBadgeStyle(document.getElementById('qzWeakBadge'), getStats(currentQuizWord));

    if (document.getElementById('autoTts').checked) speakChinese(currentQuizWord.hanzi);

    // 오답 보기 3개는 현재 범위 우선, 부족하면 전체 단어에서 추출
    const pool = studyWords.length >= 4 ? studyWords : words;
    const options = [currentQuizWord];
    let guard = 0;
    while (options.length < 4 && guard < 100) {
      guard++;
      const rand = pool[Math.floor(Math.random() * pool.length)];
      if (!options.some(o => o.hanzi === rand.hanzi)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const container = document.getElementById('qzOptions');
    container.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = opt.meaning;
      btn.onclick = () => {
        if (opt.hanzi === currentQuizWord.hanzi) {
          btn.classList.add('correct');
          if (currentQuizWord.exHanzi) speakChinese(currentQuizWord.exHanzi);
        } else {
          btn.classList.add('wrong');
          currentQuizWord.unknown = Number(currentQuizWord.unknown || 0) + 1;
        }

        saveData();
        renderTable();

        setTimeout(() => {
          nextQuiz();
        }, 700);
      };
      container.appendChild(btn);
    });
  }

  // 엑셀 업로드 시 기존 학습 기록 유지 병합
  document.getElementById('excelInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);

      const oldMap = new Map(words.map(w => [String(w.hanzi).trim(), w]));

      words = rows.map((r, idx) => {
        const cleanHanzi = String(r['한자'] || r['중국어'] || '').trim();
        const prev = oldMap.get(cleanHanzi);
        return {
          id: idx + 1,
          level: String(r['급수'] || r['레벨'] || r['분류'] || r['HSK'] || (prev ? prev.level : '1급')).trim(),
          hanzi: cleanHanzi,
          pinyin: String(r['병음'] || (prev ? prev.pinyin : '')).trim(),
          meaning: String(r['의미'] || r['뜻'] || (prev ? prev.meaning : '')).trim(),
          exHanzi: String(r['예문_한자'] || (prev ? prev.exHanzi : '')).trim(),
          exPinyin: String(r['예문_병음'] || (prev ? prev.exPinyin : '')).trim(),
          exMeaning: String(r['예문_의미'] || (prev ? prev.exMeaning : '')).trim(),
          know: r['알겠다'] !== undefined ? Number(r['알겠다']) : (prev ? prev.know : 0),
          hold: r['보류'] !== undefined ? Number(r['보류']) : (prev ? prev.hold : 0),
          unknown: r['모르겠다'] !== undefined ? Number(r['모르겠다']) : (prev ? prev.unknown : 0)
        };
      }).filter(w => w.hanzi);

      saveData();
      initLevelOptions();
      buildStudyList(true);
      alert(`${words.length}개 단어 업로드 완료! (기존 학습 기록 자동 유지)`);
    };
    reader.readAsArrayBuffer(file);
  });

  function exportExcel() {
    if (words.length === 0) return;
    const exportRows = words.map(w => {
      const s = getStats(w);
      return {
        '급수': w.level, '한자': w.hanzi, '병음': w.pinyin, '의미': w.meaning,
        '예문_한자': w.exHanzi, '예문_병음': w.exPinyin, '예문_의미': w.exMeaning,
        '알겠다': s.k, '보류': s.h, '모르겠다': s.u, '취약도(%)': s.total > 0 ? Math.round(s.weakRatio) : 0
      };
    });
    const ws = XLSX.utils.json_to_sheet(exportRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Words");
    XLSX.writeFile(wb, "chinese_vocab_backup.xlsx");
  }

  // 디버깅 완료된 Gemini AI 예문 자동 생성 함수
  async function generateExamples() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return alert('상단 입력창에 Gemini API 키를 입력해주세요.');
    localStorage.setItem('myGeminiApiKey', apiKey);

    // 현재 선택된 학습 범위(Day)에서 빈 예문 우선 탐색, 없으면 전체 단어에서 탐색
    let targets = studyWords.filter(w => !w.exHanzi || !w.exHanzi.trim());
    if (targets.length === 0) {
      targets = words.filter(w => !w.exHanzi || !w.exHanzi.trim());
    }
    if (targets.length === 0) return alert('모든 단어에 이미 예문이 들어있습니다!');

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 생성중...';

    try {
      const batch = targets.slice(0, 10);
      const prompt = `다음 중국어 단어 목록에 대해 HSK 3~4급 수준의 자연스러운 일상 회화 예문을 1개씩 만들어줘.
반드시 마크다운 코드블록 없이 순수 JSON 배열만 출력해.
출력 포맷:
[{"id":단어ID숫자,"hanzi":"단어","exHanzi":"중국어예문","exPinyin":"예문병음","exMeaning":"한국어해석"}]

단어 목록:
${JSON.stringify(batch.map(b => ({ id: b.id, hanzi: b.hanzi, meaning: b.meaning })))}`;

      const res = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error?.message || `HTTP 오류 (${res.status})`);
      }

      let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      if (!rawText) throw new Error('AI 응답이 비어 있습니다.');

      // 마크다운 ```json ... ``` 코드블록이나 앞뒤 잡음 완벽 제거
      rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
      const firstBracket = rawText.indexOf('[');
      const lastBracket = rawText.lastIndexOf(']');
      if (firstBracket !== -1 && lastBracket !== -1) {
        rawText = rawText.substring(firstBracket, lastBracket + 1);
      }

      const generated = JSON.parse(rawText);
      let updatedCount = 0;

      generated.forEach(item => {
        // ID 기준 우선 매칭 후, 한자 trim 매칭으로 이중 안전장치
        let found = words.find(w => w.id === Number(item.id));
        if (!found && item.hanzi) {
          found = words.find(w => String(w.hanzi).trim() === String(item.hanzi).trim());
        }
        if (found && item.exHanzi) {
          found.exHanzi = String(item.exHanzi).trim();
          found.exPinyin = String(item.exPinyin || '').trim();
          found.exMeaning = String(item.exMeaning || '').trim();
          updatedCount++;
        }
      });

      saveData();
      renderFlashcard();
      renderTable();
      const remain = words.filter(w => !w.exHanzi || !w.exHanzi.trim()).length;
      alert(`✅ ${updatedCount}개 단어의 예문 생성 완료! (남은 빈 예문: ${remain}개)`);
    } catch (err) {
      console.error(err);
      alert(`❌ 예문 생성 실패 원인:\n${err.message}\n\n(API 키가 정확한지, 혹은 잠시 후 다시 시도해 주세요.)`);
    } finally {
      btn.disabled = false;
      btn.textContent = '⚡ 빈 예문 AI 생성';
    }
  }

  function speakChinese(text) {
    if (!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  function speakCurrentWord() {
    if (studyWords[currentIndex]) speakChinese(studyWords[currentIndex].hanzi);
  }

  function speakCurrentExample() {
    if (studyWords[currentIndex]?.exHanzi) speakChinese(studyWords[currentIndex].exHanzi);
  }

  function toggleCardAnswer() {
    document.getElementById('fcAnswer').classList.toggle('hidden');
  }

  function moveCard(step) {
    if (studyWords.length === 0) return;
    currentIndex = (currentIndex + step + studyWords.length) % studyWords.length;
    renderFlashcard();
  }

  function initLevelOptions() {
    const sel = document.getElementById('levelFilter');
    const levels = [...new Set(words.map(w => String(w.level || '일반').trim()))];
    sel.innerHTML = `<option value="all">전체 (${words.length})</option>`;
    levels.forEach(lvl => {
      const count = words.filter(w => String(w.level || '일반').trim() === lvl).length;
      sel.innerHTML += `<option value="${lvl}">${lvl} (${count})</option>`;
    });
  }

  function switchMode(mode, btnEl) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');

    if (mode === 'flashcard') {
      document.getElementById('flashcardView').classList.remove('hidden');
      renderFlashcard();
    } else if (mode === 'quiz') {
      document.getElementById('quizView').classList.remove('hidden');
      nextQuiz();
    } else {
      document.getElementById('listView').classList.remove('hidden');
      renderTable();
    }
  }

  function resetSampleData() {
    if (confirm('모든 단어와 기록을 초기 샘플 데이터로 초기화할까요?')) {
      localStorage.removeItem('myPureVocabData');
      location.reload();
    }
  }

  function updateStatus() {
    const totalStudied = words.filter(w => (w.know + w.hold + w.unknown) > 0).length;
    const totalWeak = words.filter(w => (w.unknown || 0) + (w.hold || 0) > 0).length;
    document.getElementById('statusText').textContent =
      `전체 ${words.length}개 | 학습됨 ${totalStudied}개 | 오답·보류 ${totalWeak}개`;
  }

  function renderTable() {
    const tbody = document.getElementById('wordTableBody');
    tbody.innerHTML = studyWords.map((w, idx) => {
      const s = getStats(w);
      let badgeHtml = `<span class="weak-badge weak-none">미학습</span>`;
      if (s.total > 0) {
        const cls = s.weakRatio >= 60 ? 'weak-high' : (s.weakRatio >= 25 ? 'weak-mid' : 'weak-low');
        badgeHtml = `<span class="weak-badge ${cls}">${Math.round(s.weakRatio)}%</span>`;
      }

      return `
        <tr>
          <td><strong>#${idx + 1}</strong></td>
          <td><span style="font-weight:600; color:#0284c7; background:#e0f2fe; padding:2px 5px; border-radius:4px; font-size:0.75rem;">${w.level || '일반'}</span></td>
          <td><strong style="font-size:1rem;">${w.hanzi}</strong><br><small style="color:var(--sub)">${w.pinyin}</small></td>
          <td>${w.meaning}</td>
          <td>${w.exHanzi ? `${w.exHanzi}<br><small style="color:var(--sub)">${w.exPinyin} / ${w.exMeaning}</small>` : '-'}</td>
          <td>${badgeHtml}<br><small style="color:var(--sub)">❌${s.u}·⚠️${s.h}·⭕${s.k}</small></td>
          <td class="mini-eval-btns">
            <button class="btn-unknown" onclick="recordFromTable(${w.id}, 'unknown')">❌</button>
            <button class="btn-hold" onclick="recordFromTable(${w.id}, 'hold')">⚠️</button>
            <button class="btn-know" onclick="recordFromTable(${w.id}, 'know')">⭕</button>
          </td>
          <td><button class="outline" onclick="speakChinese('${w.hanzi}')" style="padding: 4px 6px;">🔊</button></td>
        </tr>
      `;
    }).join('');
  }

  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (document.getElementById('flashcardView').classList.contains('hidden')) return;

    if (e.code === 'Space') { e.preventDefault(); toggleCardAnswer(); }
    else if (e.key === '1') recordStudy('unknown');
    else if (e.key === '2') recordStudy('hold');
    else if (e.key === '3') recordStudy('know');
  });
</script>

</body>
</html>
